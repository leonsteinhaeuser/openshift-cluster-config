apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openshift-oauth-oidc-client-secret
  namespace: openshift-config
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: bao-vault
    kind: ClusterSecretStore
  target:
    name: openshift-oauth-oidc-client-secret
  data:
  - secretKey: clientSecret
    remoteRef:
      key: openshift-config/keycloak-oauth-client
      property: clientSecret
