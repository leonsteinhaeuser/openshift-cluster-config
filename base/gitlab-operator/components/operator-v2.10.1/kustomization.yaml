apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Subscription
      name: gitlab-operator-kubernetes
    patch: |-
      - op: replace
        path: /spec/channel
        value: stable
      - op: replace
        path: /spec/startingCSV
        value: gitlab-operator-kubernetes.v2.10.1
