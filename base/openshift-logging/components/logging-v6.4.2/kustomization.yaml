apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Subscription
      name: cluster-logging
    patch: |-
      - op: replace
        path: /spec/channel
        value: stable-6.4
      - op: replace
        path: /spec/startingCSV
        value: cluster-logging.v6.4.2
