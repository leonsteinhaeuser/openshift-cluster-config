apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Subscription
      name: kubevirt-hyperconverged
    patch: |-
      - op: replace
        path: /spec/channel
        value: stable
      - op: replace
        path: /spec/startingCSV
        value: kubevirt-hyperconverged-operator.v4.21.1
