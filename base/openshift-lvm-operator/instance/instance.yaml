apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: lvm-block
  namespace: openshift-lvm-storage
spec:
  storage:
    deviceClasses:
      - fstype: xfs
        default: true
        deviceSelector:
          paths:
            - /dev/vdb
        thinPoolConfig:
          chunkSizeCalculationPolicy: Static
          metadataSizeCalculationPolicy: Host
          sizePercent: 90
          name: ocp-thin-1
          overprovisionRatio: 10
        name: lvm-local-block
